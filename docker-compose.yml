# Development: Postgres only. The applications run directly in the devcontainer
# (ADR 0016), and `bun dev` starts this before them. Credentials are local-only
# defaults, never used outside this file.
name: diy-harness

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diy_harness
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diy_harness"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
